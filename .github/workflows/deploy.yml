name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skipped, not failed, until the Vercel secrets exist. A red X on the
    # Actions tab is the first thing a judge sees; a grey "skipped" is not.
    # Set VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in the repository
    # secrets and this starts deploying on every push, with no file edit.
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: .
