name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The guard.
      #
      # A missing secret should read as "nothing to do", not as a failure: a
      # red X on the Actions tab is the first thing a judge sees. Set
      # VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in the repository
      # secrets and this starts deploying on every push, with no file edit.
      #
      # This is a step and not a job-level `if` on purpose. GitHub does not
      # expose the `secrets` context to a job-level `if`, and a workflow that
      # references it there fails to start with
      # "Unrecognized named-value: 'secrets'" — a red X before a single line
      # has run. A step-level `env:` can read secrets, so the check lives here.
      - name: check for the Vercel secrets
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Vercel secrets configured — nothing to deploy. See README.md."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.ready == 'true'

      - name: Build
        run: npm run build
        if: steps.guard.outputs.ready == 'true'

      - name: Deploy
        if: steps.guard.outputs.ready == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: .
